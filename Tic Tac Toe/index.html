<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e94560;
    }

    /* ── Mode toggle ── */
    .mode-toggle {
      display: flex;
      align-items: center;
      background: #16213e;
      border-radius: 50px;
      padding: 4px;
      gap: 0;
    }

    .mode-toggle button {
      margin: 0;
      padding: 8px 22px;
      background: transparent;
      color: #888;
      border: none;
      border-radius: 50px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0s;
    }

    .mode-toggle button:hover { background: transparent; transform: none; color: #ccc; }
    .mode-toggle button.active { background: #e94560; color: #fff; }

    /* ── Scoreboard ── */
    .scoreboard {
      display: flex;
      gap: 40px;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      border-radius: 12px;
      padding: 12px 28px;
      min-width: 90px;
    }

    .score-box .label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 4px;
    }

    .score-box.x .value { color: #e94560; }
    .score-box.o .value { color: #0f3460; background: #e2e2e2; border-radius: 6px; }
    .score-box.draw .value { color: #aaa; }

    .score-box .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* ── Status ── */
    .status {
      font-size: 1.1rem;
      letter-spacing: 1px;
      height: 28px;
      color: #ccc;
    }

    .status span { font-weight: 700; }
    .status .x { color: #e94560; }
    .status .o { color: #a8d8ea; }

    /* ── Board ── */
    .board-wrap { position: relative; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .win-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .win-line {
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw-line 0.4s ease-out forwards;
    }

    @keyframes draw-line { to { stroke-dashoffset: 0; } }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) { background: #0f3460; transform: scale(1.04); }
    .cell.taken { cursor: default; }
    .cell.x { color: #e94560; }
    .cell.o { color: #a8d8ea; }

    .cell.winner {
      background: #0f3460;
      box-shadow: 0 0 18px rgba(233, 69, 96, 0.5);
    }

    /* ── Buttons ── */
    .buttons { display: flex; gap: 12px; }

    button {
      margin-top: 4px;
      padding: 12px 36px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover { background: #c73652; transform: scale(1.04); }

    #reset-scores {
      background: #16213e;
      color: #888;
      font-size: 0.8rem;
      padding: 12px 20px;
    }

    #reset-scores:hover { background: #0f3460; color: #ccc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="mode-toggle">
      <button id="btn-human" class="active">vs Human</button>
      <button id="btn-cpu">vs Computer</button>
    </div>

    <div class="scoreboard">
      <div class="score-box x">
        <div class="label" id="label-x">Player X</div>
        <div class="value" id="score-x">0</div>
      </div>
      <div class="score-box draw">
        <div class="label">Draws</div>
        <div class="value" id="score-draw">0</div>
      </div>
      <div class="score-box o">
        <div class="label" id="label-o">Player O</div>
        <div class="value" id="score-o">0</div>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="board-wrap">
      <div class="board" id="board">
        <div class="cell" data-i="0"></div>
        <div class="cell" data-i="1"></div>
        <div class="cell" data-i="2"></div>
        <div class="cell" data-i="3"></div>
        <div class="cell" data-i="4"></div>
        <div class="cell" data-i="5"></div>
        <div class="cell" data-i="6"></div>
        <div class="cell" data-i="7"></div>
        <div class="cell" data-i="8"></div>
      </div>
      <svg class="win-svg" id="win-svg" viewBox="0 0 346 346"></svg>
    </div>

    <div class="buttons">
      <button id="restart">New Game</button>
      <button id="reset-scores">Reset Scores</button>
    </div>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const CENTERS = [
      [55,55],[173,55],[291,55],
      [55,173],[173,173],[291,173],
      [55,291],[173,291],[291,291]
    ];

    let board, current, gameOver, vsComputer = false;
    const scores = { X: 0, O: 0, draw: 0 };

    const cells     = document.querySelectorAll('.cell');
    const statusEl  = document.getElementById('status');
    const winSvg    = document.getElementById('win-svg');
    const labelX    = document.getElementById('label-x');
    const labelO    = document.getElementById('label-o');
    const btnHuman  = document.getElementById('btn-human');
    const btnCpu    = document.getElementById('btn-cpu');

    // ── Mode toggle ──────────────────────────────────────────
    btnHuman.addEventListener('click', () => {
      if (vsComputer) { vsComputer = false; syncModeUI(); resetScores(); newGame(); }
    });
    btnCpu.addEventListener('click', () => {
      if (!vsComputer) { vsComputer = true; syncModeUI(); resetScores(); newGame(); }
    });

    function syncModeUI() {
      btnHuman.classList.toggle('active', !vsComputer);
      btnCpu.classList.toggle('active', vsComputer);
      labelX.textContent = 'You (X)';
      labelO.textContent = vsComputer ? 'Computer' : 'Player O';
      if (!vsComputer) labelX.textContent = 'Player X';
    }

    // ── AI ───────────────────────────────────────────────────
    function findWinningMove(b, player) {
      for (const [a, m, c] of WINS) {
        const vals = [b[a], b[m], b[c]];
        const empties = [a, m, c].filter(i => !b[i]);
        if (vals.filter(v => v === player).length === 2 && empties.length === 1) {
          return empties[0];
        }
      }
      return -1;
    }

    function cpuMove(b) {
      // 1. Win if possible
      const win = findWinningMove(b, 'O');
      if (win !== -1) return win;

      // 2. Block human from winning
      const block = findWinningMove(b, 'X');
      if (block !== -1) return block;

      // 3. Center
      if (!b[4]) return 4;

      // 4. Opposite corner from human
      const corners = [[0,8],[2,6],[6,2],[8,0]];
      for (const [opp, me] of corners) {
        if (b[opp] === 'X' && !b[me]) return me;
      }

      // 5. Any free corner
      for (const i of [0, 2, 6, 8]) {
        if (!b[i]) return i;
      }

      // 6. Any free edge
      for (const i of [1, 3, 5, 7]) {
        if (!b[i]) return i;
      }

      return -1;
    }

    // ── Core game ────────────────────────────────────────────
    function setStatus(msg) { statusEl.innerHTML = msg; }

    function checkWinner(b) {
      for (const [a, m, c] of WINS) {
        if (b[a] && b[a] === b[m] && b[a] === b[c]) {
          return { winner: b[a], combo: [a, m, c] };
        }
      }
      if (b.every(v => v)) return { winner: null, combo: [] };
      return null;
    }

    function placeMarker(i) {
      board[i] = current;
      cells[i].textContent = current;
      cells[i].classList.add('taken', current.toLowerCase());
    }

    function endGame(result) {
      gameOver = true;
      if (result.winner) {
        scores[result.winner]++;
        result.combo.forEach(i => cells[i].classList.add('winner'));
        drawWinLine(result.combo, result.winner);
        const name = vsComputer && result.winner === 'O' ? 'Computer' : `Player ${result.winner}`;
        setStatus(`<span class="${result.winner.toLowerCase()}">${name}</span> wins!`);
      } else {
        scores.draw++;
        setStatus('Draw!');
      }
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-draw').textContent = scores.draw;
    }

    function handleClick(e) {
      const i = parseInt(e.target.dataset.i);
      if (gameOver || board[i]) return;
      if (vsComputer && current === 'O') return; // block clicks during CPU turn

      placeMarker(i);
      const result = checkWinner(board);
      if (result) { endGame(result); return; }

      current = current === 'X' ? 'O' : 'X';

      if (vsComputer && current === 'O') {
        // Disable board briefly while CPU "thinks"
        setStatus(`<span class="o">Computer</span> is thinking…`);
        cells.forEach(c => c.style.pointerEvents = 'none');
        setTimeout(() => {
          const move = cpuMove(board);
          placeMarker(move);
          const r2 = checkWinner(board);
          if (r2) { endGame(r2); }
          else {
            current = 'X';
            setStatus(`Your turn — <span class="x">X</span>`);
          }
          cells.forEach(c => c.style.pointerEvents = '');
        }, 400);
      } else {
        setStatus(`Player <span class="${current.toLowerCase()}">${current}</span>'s turn`);
      }
    }

    function drawWinLine(combo, winner) {
      const [x1, y1] = CENTERS[combo[0]];
      const [x2, y2] = CENTERS[combo[2]];
      const color = winner === 'X' ? '#e94560' : '#a8d8ea';
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', color);
      line.classList.add('win-line');
      winSvg.appendChild(line);
    }

    function newGame() {
      board = Array(9).fill('');
      current = 'X';
      gameOver = false;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; c.style.pointerEvents = ''; });
      winSvg.innerHTML = '';
      const msg = vsComputer
        ? `Your turn — <span class="x">X</span>`
        : `Player <span class="x">X</span>'s turn`;
      setStatus(msg);
    }

    function resetScores() {
      scores.X = 0; scores.O = 0; scores.draw = 0;
      document.getElementById('score-x').textContent = 0;
      document.getElementById('score-o').textContent = 0;
      document.getElementById('score-draw').textContent = 0;
    }

    cells.forEach(c => c.addEventListener('click', handleClick));
    document.getElementById('restart').addEventListener('click', newGame);
    document.getElementById('reset-scores').addEventListener('click', resetScores);

    syncModeUI();
    newGame();
  </script>
</body>
</html>
