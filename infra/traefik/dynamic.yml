# Traefik dynamic configuration (file provider).
# Authentik forward-auth middleware: Traefik asks Authentik's embedded outpost
# to authenticate each request; on success Authentik returns the identity
# headers that apps trust (see libs/auth).
http:
  middlewares:
    # Country allow/deny gate, evaluated by the Hub (editable in its admin UI).
    geogate:
      forwardAuth:
        address: http://hub:8000/api/geo/check
        trustForwardHeader: true
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-Axus-Client-Id
    # Pre-launch IP allowlist (TEMPORARY until go-live 2026-09-28). Only these
    # sources reach the client portal entry paths. Remove the support-prelaunch
    # router (docker-compose) at go-live to open the portal; geogate stays.
    prelaunch:
      ipAllowList:
        sourceRange:
          - "47.0.0.0/8"
          - "172.191.189.223/32"
