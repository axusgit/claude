# Authentik blueprint — auto-applied on startup. Wires each platform app into
# Authentik as a forward-auth Proxy Provider + Application, binds them to the
# embedded outpost (the callback Traefik forwards to), and gates access by the
# `app-*` entitlement groups from axus-groups.yaml.
#
# This replaces the manual "Applications → Create / Outposts / policy binding"
# clicking that DEPLOY.md step 2 used to require. Apps trust the headers this
# forward-auth injects (X-authentik-email/username/name/groups — see libs/auth).
#
# External hosts are built from ${PLATFORM_DOMAIN} at apply time.
version: 1
metadata:
  name: Axus platform apps (providers + applications + outpost)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context:
  # Overridable, but defaults to the production platform domain.
  domain: !Env [PLATFORM_DOMAIN, hub.axustechnologies.com]
entries:
  # ---------------------------------------------------------------------------
  # Proxy Providers (forward-auth, single application). Each sits in front of one
  # app host; the embedded outpost enforces it and injects identity headers.
  # ---------------------------------------------------------------------------
  - id: provider-hub
    model: authentik_providers_proxy.proxyprovider
    identifiers: {name: axus-hub}
    attrs:
      name: axus-hub
      mode: forward_single
      external_host: !Format ["https://%s", !Context domain]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - id: provider-support
    model: authentik_providers_proxy.proxyprovider
    identifiers: {name: axus-support}
    attrs:
      name: axus-support
      mode: forward_single
      external_host: !Format ["https://support.%s", !Context domain]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - id: provider-accounting
    model: authentik_providers_proxy.proxyprovider
    identifiers: {name: axus-accounting}
    attrs:
      name: axus-accounting
      mode: forward_single
      external_host: !Format ["https://accounting.%s", !Context domain]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # Axus eSign lives on its own apex subdomain (aesign.axustechnologies.com),
  # not under the hub.* domain — so its external_host is a literal.
  - id: provider-legal
    model: authentik_providers_proxy.proxyprovider
    identifiers: {name: axus-legal}
    attrs:
      name: axus-legal
      mode: forward_single
      external_host: https://aesign.axustechnologies.com
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # Axus Tools live on axus-server01 (own apex subdomains, own nginx) — a
  # different box from the Hub's Traefik, so forward-auth can't reach them. Instead
  # each app is an OpenID Connect (OAuth2) client of Authentik (the same cross-box
  # SSO model Insights uses): the app redirects to Authentik, the user (already
  # signed in at the Hub) comes straight back authenticated. Access is gated by the
  # app-tools policy binding on the Application below. Secrets also live in each
  # app's .env on the box (OIDC_CLIENT_SECRET).
  - id: provider-syslog
    model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: axus-syslog}
    attrs:
      name: axus-syslog
      client_type: confidential
      client_id: axus-syslog
      client_secret: 1086b36f9bce132c89a2017ab4997c8bfb53f88e647c918ac5853482a6e53119b0dcbc37
      redirect_uris:
        - matching_mode: strict
          url: https://syslog.axustechnologies.com/auth/callback
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - id: provider-fileshare
    model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: axus-fileshare}
    attrs:
      name: axus-fileshare
      client_type: confidential
      client_id: axus-fileshare
      client_secret: 7c1902b88faa1e23c21971393a5b18f8c0c250a049ae479a534a1e46d49ab7bbd5667b90
      redirect_uris:
        - matching_mode: strict
          url: https://sp.axustechnologies.com/auth/callback
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  # ---------------------------------------------------------------------------
  # Applications (what shows in the user's Authentik library / launcher).
  # ---------------------------------------------------------------------------
  - id: app-hub-application
    model: authentik_core.application
    identifiers: {slug: axus-hub}
    attrs:
      name: Axus Hub
      slug: axus-hub
      provider: !KeyOf provider-hub
      meta_launch_url: !Format ["https://%s", !Context domain]
      meta_description: Central platform dashboard and app launcher.
      meta_publisher: Axus Technologies
      policy_engine_mode: any

  - id: app-support-application
    model: authentik_core.application
    identifiers: {slug: axus-support}
    attrs:
      name: Axus Support
      slug: axus-support
      provider: !KeyOf provider-support
      meta_launch_url: !Format ["https://support.%s", !Context domain]
      meta_description: Support desk, ticketing, and customer portal.
      meta_publisher: Axus Technologies
      policy_engine_mode: any

  - id: app-accounting-application
    model: authentik_core.application
    identifiers: {slug: axus-accounting}
    attrs:
      name: Axus Accounting
      slug: axus-accounting
      provider: !KeyOf provider-accounting
      meta_launch_url: !Format ["https://accounting.%s", !Context domain]
      meta_description: Billing and invoicing (internal).
      meta_publisher: Axus Technologies
      policy_engine_mode: any

  - id: app-legal-application
    model: authentik_core.application
    identifiers: {slug: axus-legal}
    attrs:
      name: Axus eSign
      slug: axus-legal
      provider: !KeyOf provider-legal
      meta_launch_url: https://aesign.axustechnologies.com
      meta_description: Electronic signatures (SOW/MSA), documents, and quotes.
      meta_publisher: Axus Technologies
      policy_engine_mode: any

  # --- "Axus Tools" apps (OpenID Connect clients) ----------------------------
  # Syslog and File Share sign in via OIDC against Authentik (providers above).
  # Single sign-on: authenticate once at Authentik and go straight in — no separate
  # app password. The app-tools policy binding gates who may authorize.
  - id: app-syslog-application
    model: authentik_core.application
    identifiers: {slug: axus-syslog}
    attrs:
      name: Axus Syslog
      slug: axus-syslog
      provider: !KeyOf provider-syslog
      meta_launch_url: https://syslog.axustechnologies.com
      meta_description: Network syslog collector and search dashboard.
      meta_publisher: Axus Technologies
      policy_engine_mode: any

  - id: app-fileshare-application
    model: authentik_core.application
    identifiers: {slug: axus-fileshare}
    attrs:
      name: Axus File Share
      slug: axus-fileshare
      provider: !KeyOf provider-fileshare
      meta_launch_url: https://sp.axustechnologies.com
      meta_description: Secure two-way file transfer portal.
      meta_publisher: Axus Technologies
      policy_engine_mode: any

  # ---------------------------------------------------------------------------
  # Bind all three providers to the built-in embedded outpost. Traefik's
  # forward-auth middleware forwards to this outpost on every app host.
  # ---------------------------------------------------------------------------
  - model: authentik_outposts.outpost
    identifiers: {managed: goauthentik.io/outposts/embedded}
    attrs:
      providers:
        - !KeyOf provider-hub
        - !KeyOf provider-support
        - !KeyOf provider-accounting
        - !KeyOf provider-legal

  # ---------------------------------------------------------------------------
  # Access gates. Binding a group directly to an application means only members
  # of that group pass the outpost. The Hub itself is intentionally left open to
  # ANY authenticated user — it is the front door / launcher; per-app buttons are
  # what's gated. Support & Accounting require their app-* entitlement group.
  # ---------------------------------------------------------------------------
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-support-application
      group: !Find [authentik_core.group, [name, app-support]]
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-accounting-application
      group: !Find [authentik_core.group, [name, app-accounting]]
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-legal-application
      group: !Find [authentik_core.group, [name, app-aesign]]
      order: 0
    attrs:
      enabled: true

  # Axus Tools access gates. policy_engine_mode "any" (on the apps above) means a
  # user passes if they match ANY binding: platform admins (authentik Admins) always
  # get in; non-admin "authorized personnel" get in via the app-tools group.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-syslog-application
      group: !Find [authentik_core.group, [name, app-tools]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-syslog-application
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 1
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-fileshare-application
      group: !Find [authentik_core.group, [name, app-tools]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-fileshare-application
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 1
    attrs:
      enabled: true
