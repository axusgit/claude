# Authentik blueprint — auto-applied on startup. Creates the platform's
# entitlement groups (app-*) and role groups (role-*). Assign users to these
# in the Authentik admin to grant app access and roles.
version: 1
metadata:
  name: Axus platform groups
entries:
  # --- application entitlements (gate access per app) ---
  # app-hub is not an access gate (the Hub launcher is open to any authenticated
  # user); it exists so admins can tag "platform users" and to mirror dev defaults.
  - model: authentik_core.group
    identifiers: {name: app-hub}
    attrs: {name: app-hub}
  - model: authentik_core.group
    identifiers: {name: app-support}
    attrs: {name: app-support}
  - model: authentik_core.group
    identifiers: {name: app-rmm}
    attrs: {name: app-rmm}
  - model: authentik_core.group
    identifiers: {name: app-accounting}
    attrs: {name: app-accounting}
  - model: authentik_core.group
    identifiers: {name: app-insights}
    attrs: {name: app-insights}
  - model: authentik_core.group
    identifiers: {name: app-engineering}
    attrs: {name: app-engineering}
  - model: authentik_core.group
    identifiers: {name: app-aesign}
    attrs: {name: app-aesign}
  # Controls On-Call TILE visibility in the Hub only. On-Call keeps its own
  # login — this group does NOT gate access inside the app (no forward-auth).
  - model: authentik_core.group
    identifiers: {name: app-oncall}
    attrs: {name: app-oncall}
  # Controls the "Axus Tools" section (Syslog + File Share) TILE visibility in the
  # Hub, and library visibility of their link-apps in Authentik. Both tools keep
  # their OWN login — this group does NOT gate access inside them (no forward-auth),
  # same model as app-oncall.
  - model: authentik_core.group
    identifiers: {name: app-tools}
    attrs: {name: app-tools}
  # --- eSign app roles (app-scoped, like ain-role-*; read by the eSign app) ---
  - model: authentik_core.group
    identifiers: {name: aesign-role-admin}
    attrs: {name: aesign-role-admin}
  - model: authentik_core.group
    identifiers: {name: aesign-role-manager}
    attrs: {name: aesign-role-manager}
  - model: authentik_core.group
    identifiers: {name: aesign-role-member}
    attrs: {name: aesign-role-member}
  # --- roles (mapped to in-app role by libs/auth) ---
  - model: authentik_core.group
    identifiers: {name: role-admin}
    attrs: {name: role-admin, is_superuser: false}
  - model: authentik_core.group
    identifiers: {name: role-technician}
    attrs: {name: role-technician}
  - model: authentik_core.group
    identifiers: {name: role-finance}
    attrs: {name: role-finance}
  - model: authentik_core.group
    identifiers: {name: role-engineer}
    attrs: {name: role-engineer}
  - model: authentik_core.group
    identifiers: {name: role-client}
    attrs: {name: role-client}
