# Authentik blueprint — auto-applied on startup. Creates the platform's
# entitlement groups (app-*) and role groups (role-*). Assign users to these
# in the Authentik admin to grant app access and roles.
version: 1
metadata:
  name: Axus platform groups
entries:
  # --- application entitlements (gate access per app) ---
  # app-hub is not an access gate (the Hub launcher is open to any authenticated
  # user); it exists so admins can tag "platform users" and to mirror dev defaults.
  - model: authentik_core.group
    identifiers: {name: app-hub}
    attrs: {name: app-hub}
  - model: authentik_core.group
    identifiers: {name: app-support}
    attrs: {name: app-support}
  - model: authentik_core.group
    identifiers: {name: app-rmm}
    attrs: {name: app-rmm}
  - model: authentik_core.group
    identifiers: {name: app-accounting}
    attrs: {name: app-accounting}
  - model: authentik_core.group
    identifiers: {name: app-insights}
    attrs: {name: app-insights}
  - model: authentik_core.group
    identifiers: {name: app-engineering}
    attrs: {name: app-engineering}
  - model: authentik_core.group
    identifiers: {name: app-aesign}
    attrs: {name: app-aesign}
  - model: authentik_core.group
    identifiers: {name: app-subcontractors}
    attrs: {name: app-subcontractors}
  # Gates the ATRS (Time Reporting) app: contractors + approvers both sign in
  # via SSO. Membership (or atrs-role-*) grants access; atrs-role-admin marks an
  # approver. Tile visibility too.
  - model: authentik_core.group
    identifiers: {name: app-atrs}
    attrs: {name: app-atrs}
  # Controls On-Call TILE visibility in the Hub only. On-Call keeps its own
  # login — this group does NOT gate access inside the app (no forward-auth).
  - model: authentik_core.group
    identifiers: {name: app-oncall}
    attrs: {name: app-oncall}
  # Controls the "Axus Tools" section (Syslog + File Share) TILE visibility in the
  # Hub, and library visibility of their link-apps in Authentik. Both tools keep
  # their OWN login — this group does NOT gate access inside them (no forward-auth),
  # same model as app-oncall.
  - model: authentik_core.group
    identifiers: {name: app-tools}
    attrs: {name: app-tools}
  # Gates the ACAS (Communications Analytics) OIDC app AND marks Axus staff for it:
  # while onboarding, ACAS only admits staff, and membership here (or "authentik
  # Admins") is what the app treats as staff/admin. Tile visibility too.
  - model: authentik_core.group
    identifiers: {name: app-acas}
    attrs: {name: app-acas}
  # Gates the AATS (Accounting & Tax System) OIDC app. Membership is deliberately
  # tiny: only jkahajas + acarr (assign in the Authentik admin). AATS also enforces
  # the same 2-user allowlist app-side, so this group is the authentik half of a
  # defense-in-depth pair. Tile visibility too.
  - model: authentik_core.group
    identifiers: {name: app-aats}
    attrs: {name: app-aats}
  # --- eSign app roles (app-scoped, like ain-role-*; read by the eSign app) ---
  - model: authentik_core.group
    identifiers: {name: aesign-role-admin}
    attrs: {name: aesign-role-admin}
  - model: authentik_core.group
    identifiers: {name: aesign-role-manager}
    attrs: {name: aesign-role-manager}
  - model: authentik_core.group
    identifiers: {name: aesign-role-member}
    attrs: {name: aesign-role-member}
  # --- ATRS (Time Reporting) app roles (read by the ATRS app) ---
  # atrs-role-admin = approver (review/approve/return time, see everyone).
  # atrs-role-contractor = logs their own time only. app-atrs alone also = contractor.
  - model: authentik_core.group
    identifiers: {name: atrs-role-admin}
    attrs: {name: atrs-role-admin}
  - model: authentik_core.group
    identifiers: {name: atrs-role-contractor}
    attrs: {name: atrs-role-contractor}
  # Gates the APMS (Password Management) app: anyone in app-apms, or either APMS
  # role, may reach the vault. apms-role-admin marks a vault admin (manages folders,
  # access, import, recovery). Membership is deliberately tight — technical staff
  # only. Tile visibility too. Strict like app-aats (NO authentik-Admins fallback).
  - model: authentik_core.group
    identifiers: {name: app-apms}
    attrs: {name: app-apms}
  # --- APMS (Password Management) app roles (read by the APMS app) ---
  # apms-role-admin = vault admin (folders, access, import, passphrase + recovery).
  # apms-role-user = read/write within granted folders. app-apms alone also = user.
  - model: authentik_core.group
    identifiers: {name: apms-role-admin}
    attrs: {name: apms-role-admin}
  - model: authentik_core.group
    identifiers: {name: apms-role-user}
    attrs: {name: apms-role-user}
  # --- roles (mapped to in-app role by libs/auth) ---
  - model: authentik_core.group
    identifiers: {name: role-admin}
    attrs: {name: role-admin, is_superuser: false}
  - model: authentik_core.group
    identifiers: {name: role-technician}
    attrs: {name: role-technician}
  - model: authentik_core.group
    identifiers: {name: role-finance}
    attrs: {name: role-finance}
  - model: authentik_core.group
    identifiers: {name: role-engineer}
    attrs: {name: role-engineer}
  - model: authentik_core.group
    identifiers: {name: role-client}
    attrs: {name: role-client}
