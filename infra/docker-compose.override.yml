# TEMPORARY — local test access only. Publishes Authentik + the Hub app on the
# box's loopback so they can be reached through an SSH tunnel WITHOUT cutover
# (no public exposure; 127.0.0.1 only). The Hub runs here in dev-identity mode
# (AUTH_MODE=local) so it renders WITHOUT the Traefik/Authentik forward-auth
# chain — this is a UI preview, not the real SSO login. Remove before cutover:
#   rm infra/docker-compose.override.yml && docker compose up -d
services:
  authentik-server:
    ports:
      - "127.0.0.1:9000:9000"
  hub:
    environment:
      AUTH_MODE: local
      DEV_USER_NAME: "Andy (dev preview)"
      DEV_USER_EMAIL: "acarr@axustechnologies.com"
      DEV_USER_GROUPS: "role-admin|app-hub|app-support|app-accounting"
    ports:
      - "127.0.0.1:8010:8000"
