# Axus platform stack. Run from infra/ with infra/.env present:
#   docker compose up -d
#
# Traefik routes *.hub.axustechnologies.com by Host header, terminates TLS
# (per-host Let's Encrypt), and gates apps via Authentik forward-auth.
name: axus

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
  AUTHENTIK_POSTGRESQL__NAME: authentik
  # Consumed by the axus-apps blueprint to build each app's external_host.
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
  # Email (M365 relay) — invite/recovery/MFA notifications.
  AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST}
  AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT}
  AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME}
  AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
  AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS}
  AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL}
  AUTHENTIK_EMAIL__TIMEOUT: "15"
  AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM}

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command: --configFile=/etc/traefik/traefik.yml
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
      # Docker Engine 29.x rejects the SDK's default (old) API version; pin a
      # modern one so Traefik's docker provider can read container labels.
      DOCKER_API_VERSION: "1.44"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"               # internal apps; lock down to your IPs in the AWS SG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks: [axus]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: authentik
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [axus]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [axus]

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2024.10.5}
    restart: unless-stopped
    command: server
    environment:
      <<: *authentik-env
      # akadmin removed 2026-08-17 in favor of admin@axustechnologies.com;
      # bootstrap creds intentionally omitted so akadmin is not recreated.
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./authentik/blueprints:/blueprints/axus:ro
      - ./authentik/userdata:/data:ro          # user_settings.py (bcrypt hasher override)
      - ./authentik/custom.css:/web/dist/custom.css:ro   # Axus login CSS (center + hide "powered by")
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      # identity provider UI
      traefik.http.routers.authentik.rule: Host(`id.${PLATFORM_DOMAIN}`)
      traefik.http.routers.authentik.entrypoints: websecure
      traefik.http.routers.authentik.tls.certresolver: letsencrypt
      traefik.http.routers.authentik.middlewares: geogate@file
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
      # the forward-auth outpost callback, served on EVERY app host
      traefik.http.routers.ak-outpost.rule: PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.ak-outpost.entrypoints: websecure,internal
      traefik.http.routers.ak-outpost.tls.certresolver: letsencrypt
      traefik.http.routers.ak-outpost.priority: "100"
      traefik.http.routers.ak-outpost.service: authentik
    networks: [axus]

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2024.10.5}
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./authentik/blueprints:/blueprints/axus:ro
      - ./authentik/userdata:/data:ro          # user_settings.py (bcrypt hasher override)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [axus]

  hub:
    build:
      context: ..
      dockerfile: axus-hub/hub/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_MODE: central
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      AUTHENTIK_URL: https://id.${PLATFORM_DOMAIN}
      GEO_POLICY_PATH: /data/geo_policy.json
    volumes:
      - hub_data:/data
    depends_on: [authentik-server]
    labels:
      traefik.enable: "true"
      traefik.http.routers.hub.rule: Host(`${PLATFORM_DOMAIN}`)
      traefik.http.routers.hub.entrypoints: websecure      # public 443, gated by Authentik login
      traefik.http.routers.hub.tls.certresolver: letsencrypt
      traefik.http.routers.hub.middlewares: geogate@file,authentik@file
      traefik.http.services.hub.loadbalancer.server.port: "8000"
    networks: [axus]

  support:
    build:
      context: ..
      dockerfile: axus-hub/support/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_MODE: central
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/support
      SECRET_KEY: ${SUPPORT_SECRET_KEY}
      UPLOAD_DIR: /data/uploads
    volumes:
      # Ticket attachments must survive image rebuilds (`up -d --build`); without
      # this named volume every routine update wipes them. Migrate the legacy
      # uploads dir into this volume during cutover (see DEPLOY.md step 3).
      - support_uploads:/data/uploads
    depends_on:
      postgres: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      traefik.http.routers.support.rule: Host(`support.${PLATFORM_DOMAIN}`)
      traefik.http.routers.support.entrypoints: websecure
      traefik.http.routers.support.tls.certresolver: letsencrypt
      traefik.http.routers.support.middlewares: geogate@file,authentik@file
      traefik.http.services.support.loadbalancer.server.port: "8000"
    networks: [axus]

  accounting:
    build:
      context: ..
      dockerfile: axus-hub/accounting/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_MODE: central
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/accounting
    depends_on:
      postgres: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      traefik.http.routers.accounting.rule: Host(`accounting.${PLATFORM_DOMAIN}`)
      traefik.http.routers.accounting.entrypoints: websecure      # public 443, gated by Authentik login
      traefik.http.routers.accounting.tls.certresolver: letsencrypt
      traefik.http.routers.accounting.middlewares: geogate@file,authentik@file
      traefik.http.services.accounting.loadbalancer.server.port: "8000"
    networks: [axus]

  aesign:
    build:
      context: ..
      dockerfile: axus-hub/aesign/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/aesign
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      PUBLIC_BASE_URL: https://aesign.axustechnologies.com
      STORAGE_DIR: /data/aesign
      GOTENBERG_URL: http://gotenberg:3000
      # Email (M365 relay) — reuses the platform's configured mailbox.
      SMTP_HOST: ${AUTHENTIK_EMAIL__HOST}
      SMTP_PORT: ${AUTHENTIK_EMAIL__PORT}
      SMTP_USER: ${AUTHENTIK_EMAIL__USERNAME}
      SMTP_PASS: ${AUTHENTIK_EMAIL__PASSWORD}
      # Auth/relay through support@ (SMTP_USER); recipients SEE no-reply@
      # (support@ has M365 "Send As" on the no-reply@ shared mailbox). Bounces
      # still go to support@ via MAIL_SENDER (SMTP envelope from).
      MAIL_FROM: Axus eSign <no-reply@axustechnologies.com>
      MAIL_SENDER: ${AUTHENTIK_EMAIL__USERNAME}
    volumes:
      - aesign_data:/data/aesign
    depends_on:
      postgres: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      # Staff app — gated by Authentik login. Primary host: aesign.axustechnologies.com.
      traefik.http.routers.aesign.rule: Host(`aesign.axustechnologies.com`)
      traefik.http.routers.aesign.entrypoints: websecure
      traefik.http.routers.aesign.tls.certresolver: letsencrypt
      traefik.http.routers.aesign.middlewares: geogate@file,authentik@file
      traefik.http.services.aesign.loadbalancer.server.port: "8000"
      # Public signer routes (external signers have no Axus account): the signer
      # page, its API, and the shared JS/CSS bundle bypass the auth middleware.
      traefik.http.routers.aesign-public.rule: Host(`aesign.axustechnologies.com`) && (PathPrefix(`/sign`) || PathPrefix(`/api/sign`) || PathPrefix(`/assets`))
      traefik.http.routers.aesign-public.entrypoints: websecure
      traefik.http.routers.aesign-public.tls.certresolver: letsencrypt
      traefik.http.routers.aesign-public.priority: "100"
      traefik.http.routers.aesign-public.service: aesign
    networks: [axus]

  # Headless LibreOffice for Word->PDF conversion (internal only).
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks: [axus]

  # Self-hosted ntfy — push notifications for all Axus alerts (VM uptime, disk
  # capacity, syslog keyword alerts). Replaces ntfy.sh (whose free per-IP daily
  # quota was being exhausted by the boxes' heartbeats). NO Authentik middleware:
  # the alert scripts and the phone app publish/subscribe directly, and topics are
  # unguessable secrets. Open access (like ntfy.sh anonymous) but private + unlimited.
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://ntfy.hub.axustechnologies.com
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: "24h"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: read-write
      TZ: America/New_York
    volumes:
      - ntfy_data:/var/lib/ntfy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ntfy.rule: Host(`ntfy.hub.axustechnologies.com`)
      traefik.http.routers.ntfy.entrypoints: websecure
      traefik.http.routers.ntfy.tls.certresolver: letsencrypt
      traefik.http.services.ntfy.loadbalancer.server.port: "80"
    networks: [axus]

networks:
  axus:

volumes:
  pg_data:
  redis_data:
  authentik_media:
  authentik_templates:
  traefik_letsencrypt:
  hub_data:
  support_uploads:
  aesign_data:
  ntfy_data:
