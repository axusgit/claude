# Reverse proxy for sp.axustechnologies.com -> Node app on 127.0.0.1:3210.
# certbot --nginx adds the TLS (listen 443) block and the 80->443 redirect.
server {
    server_name sp.axustechnologies.com;

    # 0 = no request-body size limit (unlimited uploads). nginx would otherwise
    # reject a large upload with 413 before it ever reaches Node.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3210;
        # Stream large uploads straight to Node instead of buffering to disk first.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts so slow/big uploads don't get cut off.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    listen 80;
}
