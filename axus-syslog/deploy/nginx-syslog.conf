# Reverse proxy for syslog.axustechnologies.com -> Node dashboard on 127.0.0.1:3260.
# certbot --nginx adds the TLS (listen 443) block and the 80->443 redirect.
#
# NOTE: this proxies only the WEB DASHBOARD (TCP/HTTP). The syslog ingest itself
# is raw UDP 514 straight to the Node process — it does NOT pass through nginx.
# Open UDP 514 to your log sources in the Lightsail firewall / security group.
server {
    server_name syslog.axustechnologies.com;

    location / {
        proxy_pass http://127.0.0.1:3260;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (live tail): don't buffer, keep the connection open.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    listen 80;
}
