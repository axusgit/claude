[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axus-auth"
version = "0.1.0"
description = "Shared central-identity (Authentik forward-auth) helpers for Axus platform apps"
requires-python = ">=3.11"
dependencies = ["fastapi"]

[tool.setuptools]
packages = ["axus_auth"]
