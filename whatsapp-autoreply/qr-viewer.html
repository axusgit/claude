<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>WhatsApp QR — scan this</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background:#111; color:#eee; margin:0; padding:24px; }
  h1 { font-size: 20px; }
  img { width: 360px; height: 360px; background:#fff; padding:12px; border-radius:12px; }
  .hint { color:#9ad; margin-top:14px; }
  .age { color:#888; font-size: 13px; margin-top:6px; }
</style>
</head>
<body>
  <h1>📱 Scan with WhatsApp → Linked Devices → Link a Device</h1>
  <img id="qr" src="qr-server.png" alt="QR loading..." />
  <div class="hint">This refreshes automatically every 5 seconds — just scan whatever shows.</div>
  <div class="age" id="age"></div>
<script>
  function tick() {
    document.getElementById('qr').src = 'qr-server.png?t=' + Date.now();
    document.getElementById('age').textContent = 'Last refresh: ' + new Date().toLocaleTimeString();
  }
  setInterval(tick, 5000);
  tick();
</script>
</body>
</html>
